[project]
name = "kontur-talk-private-inbox"
version = "0.1.0"
description = "Unofficial local inbox for private messages in a Kontur.Talk meeting"
requires-python = ">=3.11"
dependencies = [
  "pywinauto==0.6.9; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
